<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Encontro Técnico · Fogo na Amazônia Legal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: barra fixa do tablet + linha do tempo do dia à esquerda + etapa ativa em cartão largo. Painel da equipe em abas. */
:root {
  --bg: #EEF2EF; --surface: #FFFFFF; --sunk: #E3E9E5; --ink: #14251F; --muted: #5A6B65; --line: #CDD8D2;
  --forest: #164A3B; --forest-ink: #FFFFFF; --ember: #D9771A; --river: #4F8BA3; --ok: #2E7D4F; --warn: #B7791F; --bad: #B23A48;
  --g: var(--forest);
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1916; --surface: #15241F; --sunk: #1B2E28; --ink: #E4EEE9; --muted: #9AB0A8; --line: #2B4239;
  --forest: #2F7A63; --forest-ink: #FFFFFF; --ember: #F09A3E; --river: #7FB4C9; --ok: #5BBF85; --warn: #E2AE52; --bad: #E2737F; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1916; --surface: #15241F; --sunk: #1B2E28; --ink: #E4EEE9; --muted: #9AB0A8; --line: #2B4239;
  --forest: #2F7A63; --forest-ink: #FFFFFF; --ember: #F09A3E; --river: #7FB4C9; --ok: #5BBF85; --warn: #E2AE52; --bad: #E2737F; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--f-body); -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ember); outline-offset: 2px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: .005em; }
.eyebrow { font: 600 12px/1.2 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* ---------- Topo ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--forest); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--forest); color: var(--forest-ink); }
.top .wrap { display: flex; align-items: center; gap: 16px; min-height: 64px; padding-block: 8px; flex-wrap: wrap; }
.logo { height: 40px; width: auto; flex: 0 0 auto; }
@media (max-width: 700px) { .logo { height: 32px; } }
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1 1 260px; }
.brand b { font: 600 18px/1.15 var(--f-display); }
.brand span { font-size: 12.5px; opacity: .8; }
.clock { font: 600 26px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: 14px; background: rgba(255,255,255,.14); color: inherit; border: 0; }
.chip .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--g); box-shadow: 0 0 0 2px rgba(255,255,255,.8); }
.sync { font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; opacity: .92; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: #9BE3B5; display: inline-block; }
.sync.local i { background: #F5C46B; }
.sync.off i { background: #F08A8A; }

/* ---------- Início ---------- */
.home { max-width: 1040px; margin: 0 auto; padding-block: 40px 56px; display: grid; gap: 28px; }
.home h1 { font-size: clamp(28px, 4.2vw, 44px); line-height: 1.08; color: var(--forest); }
:root[data-theme="dark"] .home h1 { color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .home h1 { color: var(--ink); } }
.home p.lead { max-width: 64ch; margin: 8px 0 0; color: var(--muted); font-size: 17px; }
.homelogo { background: #FFFFFF; border-radius: var(--r); padding: 14px 18px; justify-self: start; }
.homelogo img { height: 64px; width: auto; display: block; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.tile { text-align: left; border: 0; border-radius: var(--r); padding: 20px; min-height: 150px; background: var(--g); color: #fff; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; }
.tile b { font: 700 26px/1.05 var(--f-display); }
.tile small { font-size: 14px; opacity: .95; line-height: 1.35; }
.tile:hover { filter: brightness(1.05); }
.tile.team { background: var(--surface); color: var(--ink); border: 2px solid var(--line); }
.homeinfo { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.homeinfo div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; font-size: 14.5px; }
.homeinfo b { display: block; font-family: var(--f-display); font-size: 17px; margin-bottom: 4px; }

/* ---------- Tablet ---------- */
.shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; max-width: 1360px; margin: 0 auto; padding-block: 20px 60px; }
@media (max-width: 900px) { .shell { grid-template-columns: minmax(0, 1fr); } .rail { order: 2; } }
.rail { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.daytabs { display: flex; gap: 6px; }
.daytabs button { flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 6px; font-weight: 600; font-size: 14px; }
.daytabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.tl li button { width: 100%; text-align: left; display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 9px 10px; border-radius: 8px; border: 1px solid transparent; background: transparent; }
.tl li button:hover { background: var(--surface); }
.tl .t { font: 500 13px var(--f-mono); color: var(--muted); }
.tl .n { font-size: 14.5px; line-height: 1.25; min-width: 0; }
.tl .s { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.tl li.pausa .n { color: var(--muted); font-style: italic; }
.tl li.ativa button { background: var(--surface); border-color: var(--g); box-shadow: inset 4px 0 0 var(--g); }
.tl li.ver button { background: var(--sunk); }
.s.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.s.and { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.s.agora { background: var(--g); color: #fff; }

.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; }
.stage-head { padding: 22px 24px 18px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; background: linear-gradient(180deg, color-mix(in srgb, var(--g) 9%, var(--surface)), var(--surface)); }
.stage-head h2 { font-size: clamp(26px, 3vw, 34px); line-height: 1.1; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14.5px; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 600; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 6px; background: var(--sunk); color: var(--ink); }
.badge.grupo { background: var(--g); color: #fff; }
.timer { display: grid; gap: 6px; }
.timer .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.timer .big { font: 600 22px var(--f-mono); font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--g); width: 0; transition: width .6s; }
.bar.late i { background: var(--bad); }
.lock { padding: 12px 24px; background: var(--sunk); font-size: 14.5px; border-bottom: 1px solid var(--line); }

.stage-body { padding: 22px 24px 28px; display: grid; gap: 26px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 760px) { .two { grid-template-columns: minmax(0, 1fr); } }
.box { border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; align-content: start; }
.box h3 { font-size: 18px; margin-bottom: 8px; }
.box p { margin: 0; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.steps li { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; align-items: start; }
.steps .when { font: 500 13px/1.3 var(--f-mono); color: var(--muted); }
.steps .when b { display: block; font-size: 15px; color: var(--ink); }
.steps li.now { background: color-mix(in srgb, var(--g) 10%, transparent); border-radius: 8px; padding: 6px 8px; margin: -6px -8px; }
.note { font-size: 13.5px; color: var(--muted); border-left: 3px solid var(--ember); padding: 4px 0 4px 12px; }

/* ---------- Formulário ---------- */
.form { display: grid; gap: 22px; }
.form > h3 { font-size: 20px; }
.fld { display: grid; gap: 6px; min-width: 0; }
.fld > label, .fld > .lbl { font-weight: 600; font-size: 15.5px; }
.fld .hint { font-size: 13px; color: var(--muted); margin-top: -4px; }
.fld input[type=text], .fld textarea, .fld select { width: 100%; border: 1.5px solid var(--line); background: var(--bg); border-radius: 8px; padding: 12px 14px; font-size: 17px; line-height: 1.45; }
.fld textarea { resize: vertical; min-height: 120px; }
.fld input:focus, .fld textarea:focus, .fld select:focus { border-color: var(--g); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--g) 25%, transparent); background: var(--surface); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opts label { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 999px; font-size: 15.5px; background: var(--bg); min-height: 44px; }
.opts input { width: 18px; height: 18px; accent-color: var(--g); }
.opts label:has(input:checked) { border-color: var(--g); background: color-mix(in srgb, var(--g) 14%, var(--surface)); font-weight: 600; }
.rep { display: grid; gap: 14px; }
.card { border: 1.5px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 14px; background: var(--surface); min-width: 0; }
.card > .ct { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.card > .ct b { font: 600 17px var(--f-display); }
.num { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--g); color: #fff; font: 600 14px var(--f-mono); margin-right: 8px; }
.compact .card { grid-template-columns: minmax(0, 1fr) 120px; align-items: end; }
.compact .card > .ct { grid-column: 1 / -1; }
@media (max-width: 600px) { .compact .card { grid-template-columns: minmax(0, 1fr); } }
.cardgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.score { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.score .crit { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
.seg { display: flex; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--bg); padding: 10px 0; font: 600 16px var(--f-mono); min-height: 44px; }
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--g); color: #fff; }
.total { font: 600 15px var(--f-mono); }
.rating { display: grid; gap: 10px; }
.rating .r { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 12px; align-items: center; }
@media (max-width: 600px) { .rating .r { grid-template-columns: minmax(0, 1fr); } }
.addbtn { justify-self: start; border: 1.5px dashed var(--line); background: transparent; border-radius: 8px; padding: 10px 16px; font-weight: 600; }
.foot { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 16px 24px; border-top: 1px solid var(--line); background: var(--sunk); position: sticky; bottom: 0; }
.savestate { font-size: 14px; color: var(--muted); }
.btn { border: 0; border-radius: 8px; padding: 12px 20px; font-weight: 600; font-size: 16px; min-height: 48px; background: var(--g); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.ro .fld input, .ro .fld textarea, .ro .fld select { background: var(--sunk); }
.pausebox { padding: 48px 24px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.pausebox h2 { font-size: 30px; }
.exname { justify-self: start; font: 700 15px var(--f-display); letter-spacing: .04em; text-transform: uppercase; background: var(--g); color: #fff; padding: 5px 12px; border-radius: 6px; }
.exname.none { background: var(--sunk); color: var(--muted); }
.quando { padding: 12px 24px; background: color-mix(in srgb, var(--g) 12%, var(--surface)); border-bottom: 1px solid var(--line); font-size: 15.5px; }
.pede { border-left: 6px solid var(--g); background: color-mix(in srgb, var(--g) 8%, var(--surface)); border-radius: 0 12px 12px 0; padding: 16px 20px; display: grid; gap: 6px; }
.pede-t { margin: 0; font: 600 22px/1.3 var(--f-display); }
.pede-e { margin: 0; font-size: 15px; color: var(--muted); }
.ritual { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.ritual li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 14px; }
.ritual li b { display: block; font-family: var(--f-display); font-size: 16px; }
.gaccess { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.gaccess .gc { border-radius: 12px; padding: 16px; background: var(--g); color: #fff; display: grid; gap: 8px; }
.gaccess .gc b { font: 700 22px var(--f-display); }
.gaccess .gc a, .gaccess .gc button { color: #fff; border-color: rgba(255,255,255,.6); }
.gaccess .gc .linktxt { color: rgba(255,255,255,.85); }
.rodada { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: space-between; border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 18px; background: var(--surface); }
.rodada > div { flex: 1 1 260px; }
.rt { font-size: 40px; font-weight: 600; min-width: 4ch; text-align: center; }
.rt.fim { color: var(--bad); }
.guia { background: color-mix(in srgb, var(--g) 7%, var(--surface)); border-radius: 8px; padding: 10px 14px; font-size: 14.5px; }
.obs { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 3px; }
.sentbox { display: flex; gap: 16px; align-items: center; border: 2px solid var(--ok); border-radius: 12px; padding: 18px 20px; background: color-mix(in srgb, var(--ok) 10%, var(--surface)); }
.sentbox h3 { font-size: 20px; }
.sentbox p { margin: 4px 0 0; }
.ok-ic { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 24px; flex: 0 0 auto; }
.sendzone { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.confirm { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: var(--surface); border: 2px solid var(--ember); border-radius: 10px; padding: 10px 14px; }
.confirm span { font-weight: 600; max-width: 46ch; }

/* ---------- Painel da equipe ---------- */
.panel { max-width: 1440px; margin: 0 auto; padding-block: 20px 60px; display: grid; gap: 18px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 10px 14px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ember); }
.ctrl { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 960px) { .ctrl { grid-template-columns: minmax(0, 1fr); } }
.now-card { background: var(--forest); color: #fff; border-radius: 14px; padding: 20px 22px; display: grid; gap: 8px; }
.now-card h2 { font-size: 30px; }
.now-card .muted { color: rgba(255,255,255,.8); }
.stlist { display: grid; gap: 6px; }
.strow { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.strow.ativa { border-color: var(--ember); box-shadow: inset 4px 0 0 var(--ember); }
.strow.pausa { background: transparent; color: var(--muted); }
.dots { display: flex; gap: 4px; }
.dots i { width: 14px; height: 14px; border-radius: 4px; border: 2px solid var(--gc); background: transparent; }
.dots i.and { background: color-mix(in srgb, var(--gc) 45%, transparent); }
.dots i.ok { background: var(--gc); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 9px 11px; border-bottom: 1px solid var(--line); }
th { background: var(--sunk); font-weight: 600; font-size: 13px; position: sticky; top: 0; }
td.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.gtag { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; }
.gtag::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--gc); }
.cols4 { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 12px; overflow-x: auto; }
.col { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; border-top: 5px solid var(--gc); }
.col dl { margin: 0; display: grid; gap: 8px; }
.col dt { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.col dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; }
.empty { color: var(--muted); font-style: italic; font-size: 14px; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toolbar select { border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 12px; background: var(--surface); max-width: 100%; }
.termo { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.termo .card label { display: grid; grid-template-columns: 90px 1fr; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.termo input { border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); width: 100%; font-family: var(--f-mono); }
.banner { padding: 12px 16px; border-radius: 10px; background: color-mix(in srgb, var(--warn) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); font-size: 14.5px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 8px; font-weight: 600; z-index: 20; }
textarea.io { width: 100%; min-height: 160px; font-family: var(--f-mono); font-size: 12.5px; border: 1.5px solid var(--line); border-radius: 8px; padding: 10px; background: var(--bg); }
.navbtn { border: 1px solid rgba(255,255,255,.35); background: transparent; color: inherit; border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 14px; text-decoration: none; }
.mapa { max-width: 1360px; margin: 0 auto; padding-block: 24px 60px; display: grid; gap: 22px; }
.mapa .dayhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
.mapa .dayhead h2 { font-size: 26px; }
.boxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.sbox { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.sbox.grupo { border-top: 5px solid var(--ember); }
.sbox.ind { border-top: 5px solid var(--river); }
.sbox .top2 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.sbox h3 { font-size: 19px; line-height: 1.2; }
.sbox .tema { font-size: 12.5px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.sbox ul { margin: 0; padding-left: 18px; font-size: 14px; display: grid; gap: 2px; }
.sbox .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
.sbox .acts a { text-decoration: none; display: inline-flex; align-items: center; }
.ex { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 6px; }
.ex.g { background: color-mix(in srgb, var(--ember) 18%, transparent); color: var(--ember); }
.ex.i { background: color-mix(in srgb, var(--river) 20%, transparent); color: var(--river); }
.ex.n { background: var(--sunk); color: var(--muted); }
.legend { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.about { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 18px; }
.about summary { cursor: pointer; font: 600 17px var(--f-display); padding: 10px 0; }
.about ol, .about dl { margin: 0 0 14px; font-size: 14.5px; }
.about dt { font-weight: 600; margin-top: 6px; }
.about dd { margin: 0; color: var(--muted); }
.pauserow { font-size: 13.5px; color: var(--muted); font-style: italic; padding: 0 4px; }
.linktxt { font: 500 12px var(--f-mono); color: var(--muted); overflow-wrap: anywhere; }
.kiosk { max-width: 860px; margin: 0 auto; padding-block: 24px 60px; display: grid; gap: 18px; }
.thanks { text-align: center; padding: 60px 20px; display: grid; gap: 14px; justify-items: center; }
.stat { display: grid; grid-template-columns: minmax(0,1fr) 70px 1fr; gap: 10px; align-items: center; font-size: 14.5px; }
.stat .bar { height: 10px; }
@media (max-width: 700px) { .top { position: static; } body::before { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

// ---------- tablet ----------
function tabletHTML(g) {
  const act = activeStage();
  const e = E[S.view] || (DEMO ? WORK.find(x => x.ex) : act);
  S.view = e.id;
  if (!S.dayView) S.dayView = e.dia;
  return `<div class="wrap"><div class="shell">
    <aside class="rail">${railHTML(g)}</aside>
    <section>${stageHTML(e, g, act)}</section>
  </div></div>`;
}
function railHTML(g) {
  const act = activeStage();
  const day = S.dayView || act.dia;
  return `<div class="daytabs" role="group" aria-label="Dia">${DIAS.map(d => `<button data-day="${d.n}" aria-pressed="${d.n === day}">Dia ${d.n}</button>`).join('')}</div>
    <div class="eyebrow" style="padding:4px 2px">${esc(DIAS[day - 1].eixo)}</div>
    <ol class="tl">${ETAPAS.filter(e => e.dia === day).map(e => {
      if (e.tipo === 'pausa') return `<li class="pausa"><button disabled><span class="t">${hm(e.ini)}</span><span class="n">${esc(e.sessao)}</span><span></span></button></li>`;
      const st = statusOf(e.id, g.id); const isAct = e.id === act.id;
      const pill = st === 'enviada' ? '<span class="s ok">Enviado</span>' : (isAct && !DEMO) ? '<span class="s agora">Agora</span>' : '';
      const sel = DEMO ? e.id === S.view : isAct;
      return `<li class="${sel ? 'ativa' : ''}"><button ${isAct || DEMO ? `data-go="${e.id}"` : 'disabled'}><span class="t">${hm(e.ini)}</span><span class="n">${e.ex ? `<b class="mono" style="font-size:12px">Ex. ${e.ex}</b> ` : ''}${esc(e.sessao)}</span>${pill}</button></li>`;
    }).join('')}</ol>
    <p class="muted" style="font-size:12.5px;margin:6px 2px">${DEMO ? 'Demonstração: todos os exercícios estão abertos para conhecer. No encontro, só o exercício liberado pela equipe fica aberto.' : 'Só o exercício liberado pela equipe fica aberto.'} Depois de enviado, não é possível voltar nem editar.</p>`;
}
function stepsHTML(e) {
  let t = toMin(e.ini);
  return `<ol class="steps">${e.passos.map(p => { const a = t; t += p.min; return `<li><span class="when"><b>${p.min} min</b>${fromMin(a)}–${fromMin(t)}</span><span>${esc(p.txt)}</span></li>`; }).join('')}</ol>`;
}
const fill = (s, g) => String(s || '').replace('{mesa}', g.mesa).replace('{eixo}', g.eixo);
const hhmm = (ts) => { const d = new Date(ts); return `${pad(d.getHours())}h${pad(d.getMinutes())}`; };
function stageHead(e, g) {
  const tipo = e.tipo === 'grupo' ? '<span class="badge grupo">Dinâmica em grupo</span>' : e.tipo === 'apoio' ? '<span class="badge">Acolhimento</span>' : '<span class="badge">Plenária</span>';
  return `<div class="stage-head">
      ${e.ex ? `<span class="exname">${esc(e.exNome)}</span>` : `<span class="exname none">Sem exercício nesta sessão</span>`}
      <div class="meta">${tipo}<span><b>${esc(DIAS[e.dia - 1].rotulo)}</b></span><span class="mono"><b>${hm(e.ini)}–${hm(e.fim)}</b></span><span>Conteúdo: <b>${esc(e.quem)}</b></span><span>Tema: <b>${esc(e.tema)}</b></span></div>
      <h2>${esc(e.sessao)}</h2>
      <div class="timer" data-timer="${e.id}"><div class="row"><span class="big"></span><span class="sub muted"></span></div><div class="bar"><i></i></div></div>
    </div>`;
}
const isOpen = (e) => DEMO || e.id === activeStage().id;
function stageHTML(e, g, act) {
  const order = WORK.findIndex(x => x.id === e.id), actOrder = WORK.findIndex(x => x.id === act.id);
  const doc = getDoc(e.id, g.id);
  if (!isOpen(e) || (DEMO && doc.status === 'enviada' && false)) {
    const msg = doc.status === 'enviada' ? `<h2>${esc(e.exNome || e.sessao)}</h2><p>Enviado às <b>${hhmm(doc.enviadoEm)}</b>. Depois do envio não é possível voltar nem editar.</p>`
      : order > actOrder ? `<h2>${esc(e.exNome || e.sessao)}</h2><p>Ainda não liberado. A equipe libera cada exercício no horário da programação: <b>${hm(e.ini)}–${hm(e.fim)}</b>.</p>`
      : `<h2>${esc(e.exNome || e.sessao)}</h2><p>Etapa encerrada.</p>`;
    return `<article class="stage"><div class="pausebox">${msg}<button class="btn" data-go="${act.id}">Ir para o exercício atual</button></div></article>`;
  }
  const sent = doc.status === 'enviada';
  return `<article class="stage" data-stage="${e.id}">
    ${stageHead(e, g)}
    ${e.ex && !sent ? `<div class="quando"><b>Quando:</b> ${esc(e.quando)}</div>` : ''}
    <div class="stage-body">
      ${e.ex && !sent ? `<div class="pede"><span class="eyebrow">O que este exercício pede</span><p class="pede-t">${esc(e.pede)}</p><p class="pede-e"><b>O grupo entrega:</b> ${esc(e.entrega)}</p></div>` : ''}
      ${e.tipo === 'grupo' && !sent ? `<div class="rodada"><div><b>Rodada de 1 minuto</b><span class="muted" style="display:block;font-size:13.5px">Cada pessoa fala uma vez. Toque para iniciar o tempo de quem vai falar.</span></div><span class="rt mono" id="rt">1:00</span><button class="btn" data-rodada="1" id="rtbtn">Iniciar</button></div>` : ''}
      ${sent ? `<div class="sentbox"><span class="ok-ic" aria-hidden="true">✓</span><div><h3>${esc(e.exNome)} enviado às ${hhmm(doc.enviadoEm)}</h3><p>As respostas do ${esc(g.nome)} foram registradas. Aguarde a equipe liberar o próximo exercício.</p></div></div>` : ''}
      <div class="two">
        <div class="box"><h3>O que o grupo faz</h3><p>${esc(fill(e.papel, g))}</p>
          ${e.observe?.length ? `<p style="margin-top:12px;font-weight:600">Perguntas para orientar o registro</p><ul class="obs">${e.observe.map(o => `<li>${esc(o)}</li>`).join('')}</ul>` : ''}
          <p class="muted" style="margin-top:10px;font-size:14px"><b>Conteúdo da sessão:</b> ${esc(e.conteudo)}</p>
          <p class="muted" style="margin-top:6px;font-size:14px"><b>Resultado esperado:</b> ${esc(e.resultado)}</p></div>
        <div class="box"><h3>Passo a passo no tempo</h3>${stepsHTML(e)}</div>
      </div>
      ${e.nota ? `<p class="note">${esc(e.nota)}</p>` : ''}
      ${e.individual ? `<div class="box" style="border-color:var(--river)"><h3>${esc(e.individual.titulo)}</h3><p>Exercício individual. Cada participante responde a sua avaliação, no tablet (uma pessoa por vez) ou na ficha impressa.</p><p style="margin-top:10px"><a class="btn" href="#avaliacao" style="text-decoration:none;display:inline-flex;align-items:center">Abrir avaliação individual</a></p></div>` : ''}
      ${e.ex && !sent ? `<div class="form" data-doc="${docId(e.id, g.id)}"><h3>${esc(e.exNome)} · registro do ${esc(g.nome)}</h3>${e.campos.map(f => fieldHTML(f, doc.dados, true, e, g)).join('')}</div>` : !e.ex ? `<p class="muted">Nesta sessão o grupo acompanha a apresentação. Não há exercício.</p>` : ''}
    </div>
    ${e.ex && !sent ? `<div class="foot"><span class="savestate" data-save="${docId(e.id, g.id)}">${doc.atualizadoEm ? 'Rascunho salvo' : 'Rascunho salvo automaticamente enquanto o grupo escreve'}</span>
      <div class="sendzone" id="sendzone"><button class="btn" data-enviar="${e.id}">Enviar ${esc(e.exNome.split(' · ')[0].toLowerCase())}</button></div></div>` : ''}
  </article>`;
}

// ---------- campos ----------
function fieldHTML(f, data, ed, e, g, path = '') {
  const key = path + f.k; const v = data?.[f.k];
  const dis = ed ? '' : 'disabled';
  const id = 'f-' + key.replace(/[^\w-]/g, '_');
  const hint = f.h ? `<span class="hint">${esc(f.h)}</span>` : '';
  switch (f.t) {
    case 'line': return `<div class="fld"><label for="${id}">${esc(f.l)}</label>${hint}<input type="text" id="${id}" data-k="${key}" value="${esc(v || '')}" ${dis}></div>`;
    case 'area': return `<div class="fld"><label for="${id}">${esc(f.l)}</label>${hint}<textarea id="${id}" data-k="${key}" rows="${Math.max(4, (f.rows || 3) + 1)}" ${dis}>${esc(v || '')}</textarea></div>`;
    case 'select': return `<div class="fld"><label for="${id}">${esc(f.l)}</label><select id="${id}" data-k="${key}" ${dis}><option value="">Selecione</option>${f.o.map(o => `<option ${v === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></div>`;
    case 'choice': return `<div class="fld"><span class="lbl">${esc(f.l)}</span><div class="opts" role="radiogroup">${f.o.map(o => `<label><input type="radio" name="${id}" data-k="${key}" value="${esc(o)}" ${v === o ? 'checked' : ''} ${dis}>${esc(o)}</label>`).join('')}</div></div>`;
    case 'multi': return `<div class="fld"><span class="lbl">${esc(f.l)}</span><div class="opts">${f.o.map(o => `<label><input type="checkbox" data-k="${key}" data-multi="1" value="${esc(o)}" ${(v || []).includes(o) ? 'checked' : ''} ${dis}>${esc(o)}</label>`).join('')}</div></div>`;
    case 'repeat': {
      const arr = Array.isArray(v) ? v : [];
      const n = Math.max(f.n, arr.length);
      return `<div class="fld"><span class="lbl">${esc(f.item)}s</span><div class="rep ${f.compact ? 'compact' : 'cardgrid'}" ${f.compact ? '' : 'style="grid-template-columns:minmax(0,1fr)"'}>${Array.from({ length: n }, (_, i) =>
        `<div class="card"><div class="ct"><b><span class="num">${i + 1}</span>${esc(f.titles ? f.item + ': ' + f.titles[i] : f.item)}</b></div>${f.guias && f.guias[i] ? `<div class="guia"><span class="eyebrow">Perguntas para orientar a rodada</span><ul class="obs">${f.guias[i].map(q => `<li>${esc(q)}</li>`).join('')}</ul></div>` : ''}${f.f.map(sf => fieldHTML(sf, arr[i] || {}, ed, e, g, `${key}.${i}.`)).join('')}</div>`).join('')}</div></div>`;
    }
    case 'rating': {
      const o = v || {};
      return `<div class="fld"><span class="lbl">${esc(f.l)}</span><div class="rating">${f.o.map((q, i) => `<div class="r"><span>${esc(q)}</span><div class="seg" role="group" aria-label="${esc(q)}">${[1, 2, 3, 4, 5].map(nv => `<button type="button" data-k="${key}.${i}" data-val="${nv}" aria-pressed="${o[i] == nv}" ${dis}>${nv}</button>`).join('')}</div></div>`).join('')}</div></div>`;
    }
    case 'clinica': {
      const arr = clinicaItems(g, v);
      return `<div class="fld"><span class="lbl">${esc(f.l)}</span><span class="hint">As primeiras vêm do Exercício 5 (Dia 1). Inclua nos campos seguintes as demandas que surgiram hoje.</span><div class="rep">${arr.map((it, i) =>
        `<div class="card"><div class="ct"><b><span class="num">${i + 1}</span>Demanda</b>${it.origem ? `<span class="badge">${esc(it.origem)}</span>` : ''}</div>
          ${fieldHTML({ k: 'demanda', t: 'area', l: 'Demanda', rows: 1 }, it, ed, e, g, `${key}.${i}.`)}
          ${fieldHTML({ k: 'categoria', t: 'choice', l: 'Categoria', o: f.o }, it, ed, e, g, `${key}.${i}.`)}
          <div class="two">${fieldHTML({ k: 'competente', t: 'line', l: 'Produto ou instituição que pode atender' }, it, ed, e, g, `${key}.${i}.`)}
          ${fieldHTML({ k: 'lacuna', t: 'line', l: 'Lacuna que permanece' }, it, ed, e, g, `${key}.${i}.`)}</div>
          ${/SISFOGO/.test(it.categoria || '') ? fieldHTML({ k: 'requisito', t: 'line', l: 'Requisito de integração (trilha SISFOGO/ADPF nº 743)' }, it, ed, e, g, `${key}.${i}.`) : ''}
        </div>`).join('')}</div>${ed ? `<button type="button" class="addbtn" data-add="${key}">+ Incluir outra demanda</button>` : ''}</div>`;
    }
    case 'priorizacao': {
      const arr = priorItems(g, v);
      return `<div class="fld"><span class="lbl">${esc(f.l)}</span><span class="hint">1 = baixo · 2 = médio · 3 = alto. Em dependências, 3 significa poucas dependências.</span><div class="rep">${arr.map((it, i) => {
        const tot = f.crit.reduce((a, _, c) => a + (Number(it['c' + c]) || 0), 0);
        return `<div class="card"><div class="ct"><b><span class="num">${i + 1}</span>${esc(it.demanda || 'Demanda')}</b><span class="total">Total ${tot} / 18</span></div>
          ${it.categoria ? `<span class="muted" style="font-size:13.5px">${esc(it.categoria)}</span>` : ''}
          ${!it.fixa ? fieldHTML({ k: 'demanda', t: 'line', l: 'Demanda' }, it, ed, e, g, `${key}.${i}.`) : ''}
          <div class="score">${f.crit.map((c, ci) => `<div class="crit">${esc(c)}<div class="seg">${[1, 2, 3].map(nv => `<button type="button" data-k="${key}.${i}.c${ci}" data-val="${nv}" aria-pressed="${it['c' + ci] == nv}" ${dis}>${nv}</button>`).join('')}</div></div>`).join('')}</div>
          ${fieldHTML({ k: 'horizonte', t: 'choice', l: 'Horizonte', o: f.hz }, it, ed, e, g, `${key}.${i}.`)}
        </div>`; }).join('')}</div>${ed ? `<button type="button" class="addbtn" data-add="${key}">+ Incluir outra demanda</button>` : ''}</div>`;
    }
  }
  return '';
}
function clinicaItems(g, v) {
  if (Array.isArray(v) && v.length) return v;
  const d1 = S.resp[docId('d1-grupos', g.id)]?.dados?.demandas || [];
  const base = d1.filter(x => x && x.problema).map(x => ({ demanda: x.problema, competente: x.competente || '', lacuna: x.lacuna || '', origem: 'Dia 1' }));
  while (base.length < 5) base.push({ demanda: '', origem: 'Dia 1' });
  while (base.length < 7) base.push({ demanda: '' });
  return base;
}
function priorItems(g, v) {
  if (Array.isArray(v) && v.length) return v;
  const cl = S.resp[docId('d2-clinicas', g.id)]?.dados?.itens || [];
  const base = cl.filter(x => x && x.demanda).map(x => ({ demanda: x.demanda, categoria: x.categoria || '', fixa: true }));
  while (base.length < 3) base.push({ demanda: '' });
  return base;
}

// set by path "a.0.b"
function setPath(obj, path, val) {
  const ks = path.split('.'); let o = obj;
  for (let i = 0; i < ks.length - 1; i++) { const k = ks[i], nk = ks[i + 1]; if (o[k] == null) o[k] = /^\d+$/.test(nk) ? [] : {}; o = o[k]; }
  o[ks[ks.length - 1]] = val;
}
function getPath(obj, path) { return path.split('.').reduce((o, k) => o == null ? undefined : o[k], obj); }

function editDoc(formEl, mut) {
  const id = formEl.dataset.doc; const doc = S.resp[id]; if (!doc || doc.status === 'enviada') return; const e = E[doc.etapa]; const g = G[doc.grupo];
  // materializa listas derivadas na primeira edição
  e.campos.forEach(f => { if ((f.t === 'clinica' || f.t === 'priorizacao') && !Array.isArray(doc.dados[f.k])) doc.dados[f.k] = JSON.parse(JSON.stringify(f.t === 'clinica' ? clinicaItems(g) : priorItems(g))); });
  mut(doc.dados);
  doc.atualizadoEm = Date.now(); doc.status = 'andamento';
  doc.lider = doc.dados?.lider || '';
  queueSave(id);
}

// ---------- eventos ----------
document.addEventListener('input', ev => {
  const ta = ev.target; const af = ta.closest?.('.form[data-aval]');
  if (af && ta.dataset.k) { if (ta.type === 'radio') setPath(S.aval, ta.dataset.k, ta.value); else setPath(S.aval, ta.dataset.k, ta.value); return; }
  const t = ev.target; const form = t.closest('.form[data-doc]'); if (!form || t.disabled) return;
  const k = t.dataset.k; if (!k) return;
  if (t.type === 'checkbox' && t.dataset.multi) { editDoc(form, d => { const arr = new Set(getPath(d, k) || []); t.checked ? arr.add(t.value) : arr.delete(t.value); setPath(d, k, [...arr]); }); return; }
  if (t.type === 'radio') { editDoc(form, d => setPath(d, k, t.value)); if (/categoria$/.test(k)) rerenderStage(); return; }
  editDoc(form, d => setPath(d, k, t.value));
});
document.addEventListener('change', ev => { const t = ev.target; if (t.tagName === 'SELECT' && t.closest('.form[data-doc]')) { const form = t.closest('.form'); editDoc(form, d => setPath(d, t.dataset.k, t.value)); } });
function rerenderStage() { const y = scrollY; const g = G[S.role]; const sec = $('.shell > section'); if (sec) { sec.innerHTML = stageHTML(E[S.view], g, activeStage()); tick(); } scrollTo(0, y); }

document.addEventListener('click', async ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.hash) { if (S.pendingStage) { location.hash = b.dataset.hash + '-' + S.pendingStage; S.pendingStage = null; } else location.hash = b.dataset.hash; return; }
  if (b.dataset.role) { S.role = b.dataset.role; LS.set('role', S.role); S.view = null; S.dayView = null; if (S.pendingStage && S.role !== 'equipe') { S.view = S.pendingStage; S.dayView = E[S.pendingStage].dia; } S.pendingStage = null; render(); scrollTo(0, 0); return; }
  if (b.dataset.copylink) { const url = BASE + '#' + b.dataset.copylink; try { await navigator.clipboard.writeText(url); toast('Link copiado'); } catch { toast(url); } return; }
  if (b.id === 'aval-enviar') { await enviarAval(); return; }
  if (b.id === 'aval-proxima') { S.aval = {}; S.avalSent = false; render(); scrollTo(0, 0); return; }
  if (b.dataset.val && b.closest('.form[data-aval]')) { setPath(S.aval, b.dataset.k, Number(b.dataset.val)); const y = scrollY; render(); scrollTo(0, y); return; }
  if (b.id === 'trocar') { if (b.dataset.armed) { S.role = null; LS.del('role'); if (SUPA) { LS.del('codigo'); location.reload(); return; } render(); return; } b.dataset.armed = '1'; b.textContent = 'Tocar de novo para trocar'; setTimeout(() => render(), 3000); return; }
  if (b.dataset.day) { S.dayView = Number(b.dataset.day); $('.rail').innerHTML = railHTML(G[S.role]); return; }
  if (b.dataset.go) { S.view = b.dataset.go; S.dayView = E[b.dataset.go].dia; render(); scrollTo(0, 0); return; }
  if (b.dataset.val && b.closest('.form[data-doc]')) { const form = b.closest('.form'); editDoc(form, d => setPath(d, b.dataset.k, Number(b.dataset.val))); rerenderStage(); return; }
  if (b.dataset.add) { const form = b.closest('.form'); editDoc(form, d => { const arr = getPath(d, b.dataset.add) || []; arr.push({ demanda: '' }); setPath(d, b.dataset.add, arr); }); rerenderStage(); return; }
  if (b.id === 'entrar') { entrar(); return; }
  if (b.dataset.rodada) { iniciarRodada(); return; }
  if (b.dataset.enviar) { const z = $('#sendzone'); const e = E[b.dataset.enviar]; z.innerHTML = `<div class="confirm" role="alert"><span>Depois de enviar, o grupo não poderá voltar nem editar o ${esc(e.exNome)}. Confirmar envio?</span><button class="btn" data-confirmar="${e.id}">Confirmar envio</button><button class="btn ghost" data-revisar="${e.id}">Revisar</button></div>`; return; }
  if (b.dataset.revisar) { const e = E[b.dataset.revisar]; $('#sendzone').innerHTML = `<button class="btn" data-enviar="${e.id}">Enviar ${esc(e.exNome.split(' · ')[0].toLowerCase())}</button>`; return; }
  if (b.dataset.confirmar) { b.disabled = true; await enviarExercicio(b.dataset.confirmar); return; }
  // painel
  if (b.dataset.tab) { S.tab = b.dataset.tab; LS.set('tab', S.tab); render(); return; }
  if (b.dataset.liberar) { await liberar(b.dataset.liberar); return; }
  if (b.dataset.auto) { await liberar(null); return; }
  if (b.dataset.exp) { await exportar(b.dataset.exp); return; }
  if (b.id === 'imp-btn') { importar(); return; }
  if (b.dataset.copy) { const ta = $('#' + b.dataset.copy); try { await navigator.clipboard.writeText(ta.value); toast('Copiado'); } catch { ta.select(); toast('Selecionado. Use copiar do teclado.'); } return; }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'resp-stage') { S.respStage = t.value; render(); }
  if (t.dataset.termo) { const [uf, cor] = t.dataset.termo.split('|'); const cur = { ...(S.termo[uf] || {}) }; cur[cor] = Number(t.value) || 0; S.termo[uf] = cur; if (S.db && S.mode === 'online') S.db.doc('termometro/' + uf.replace(/\s/g, '_')).set({ uf, ...cur }).catch(() => toast('Não foi possível salvar o termômetro.')); LS.set('termo', S.termo); }
});

function avaliacaoHTML() {
  const ind = E['d3-encerramento'].individual;

async function enviarAval() {
  const rec = { ...JSON.parse(JSON.stringify(S.aval)), tablet: S.role || '', enviadoEm: Date.now() };
  const has = Object.values(S.aval).some(v => v && (typeof v !== 'object' || Object.keys(v).length));
  if (!has) { toast('Preencha ao menos uma resposta.'); return; }
  const loc = LS.get('avals', []); loc.push(rec); LS.set('avals', loc);
  if (S.db && S.mode === 'online') { try { await S.db.collection('avaliacoes').add(rec); rec.sync = true; loc[loc.length - 1].sync = true; LS.set('avals', loc); } catch { toast('Guardada neste aparelho; será enviada depois.'); } }
  S.avalSent = true; S.aval = {}; render(); scrollTo(0, 0);
}
function avaliacoesHTML() {
  const all = S.avals.length ? S.avals : LS.get('avals', []);
  const ind = E['d3-encerramento'].individual; const items = ind.campos[0].o;

  return `<div class="two"><div class="box" style="display:grid;gap:10px"><h3>${all.length} avaliações</h3>${items.map((q, i) => `<div class="stat"><span>${esc(q)}</span><span class="mono">${med[i].toFixed(1)}</span><div class="bar"><i style="width:${med[i] / 5 * 100}%"></i></div></div>`).join('')}
    <p class="muted" style="font-size:13.5px">${Object.entries(perf).map(([k, v]) => `${esc(k)}: ${v}`).join(' · ')}</p><button class="btn small ghost" data-exp="aval">Baixar avaliações (CSV)</button></div>
    <div class="box" style="display:grid;gap:10px"><h3>Comentários</h3>${all.filter(a => a.manter || a.melhorar || a.compromisso).map(a => `<div style="border-bottom:1px solid var(--line);padding-bottom:8px;font-size:14px">${a.manter ? `<div><b>Manter:</b> ${esc(a.manter)}</div>` : ''}${a.melhorar ? `<div><b>Melhorar:</b> ${esc(a.melhorar)}</div>` : ''}${a.compromisso ? `<div><b>Compromisso:</b> ${esc(a.compromisso)}</div>` : ''}</div>`).join('') || '<p class="empty">Sem comentários.</p>'}</div></div>`;
}

// ---------- painel da equipe ----------
async function liberar(id) {
  S.ativa = id; S.ativaAuto = !id;
  if (S.db && S.mode === 'online') { try { await S.db.doc('controle/estado').set({ ativa: id || '', atualizadoEm: Date.now() }); toast(id ? 'Etapa liberada para os 4 tablets' : 'Tablets seguindo o relógio'); } catch { toast('Não foi possível liberar. Verifique a conexão.'); } }
  else toast('Sem conexão: cada tablet segue o próprio relógio.');
  render();
}
function panelHTML() {
  const tabs = [['conducao', 'Condução'], ['mapa', 'Mapa e links'], ['respostas', 'Respostas por etapa'], ['matriz', 'Matriz comum'], ['perguntas', 'Perguntas'], ['termometro', 'Termômetro'], ['avaliacoes', 'Avaliações'], ['exportar', 'Exportar e importar']];
  return `<div class="wrap"><div class="panel">
    ${S.mode === 'demo' ? `<div class="banner">Demonstração: libere etapas e veja as respostas deste aparelho. Nada é gravado na base do encontro.</div>` : ''}
    ${S.mode === 'local' ? `<div class="banner">Modo local: este aparelho não está sincronizando. Os tablets seguem o próprio relógio e guardam as respostas. Ao final, importe o arquivo de cada tablet na aba Exportar e importar.</div>` : ''}
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${l}</button>`).join('')}</div>
    <div id="tabbody">${({ mapa: () => mapaHTML().replace('class="wrap"', 'class=""'), conducao: conducaoHTML, respostas: respostasHTML, matriz: matrizHTML, perguntas: perguntasHTML, termometro: termoHTML, avaliacoes: avaliacoesHTML, exportar: exportHTML })[S.tab]()}</div>
  </div></div>`;
}
function afterPanel() { tick(); }
function dotsFor(e) { return `<span class="dots">${GRUPOS.map(g => { const s = statusOf(e.id, g.id); return `<i class="${s === 'enviada' ? 'ok' : s === 'andamento' ? 'and' : ''}" style="--gc:${g.cor}" title="${esc(g.nome)}: ${s === 'enviada' ? 'enviado' : s === 'andamento' ? 'em rascunho' : 'sem registro'}"></i>`; }).join('')}</span>`; }
function conducaoHTML() {
  const act = activeStage(); const ck = clockStage();
  return `<div class="ctrl">
    <div style="display:grid;gap:14px;min-width:0">
      <div class="now-card"><span class="eyebrow" style="color:rgba(255,255,255,.75)">${S.ativa ? 'Etapa liberada pela equipe' : 'Seguindo o relógio'} · ${esc(DIAS[act.dia - 1].rotulo)}</span>
        <h2>${esc(act.sessao)}</h2><span class="mono">${hm(act.ini)}–${hm(act.fim)} · ${esc(act.quem || '')}</span>
        <div class="timer" data-timer="${act.id}"><div class="row"><span class="big"></span><span class="sub muted"></span></div><div class="bar"><i></i></div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${dotsFor(act)}<span class="muted" style="font-size:13px">Grupos: ${GRUPOS.map(g => g.papel).join(' · ')}</span></div>
      </div>
      ${ck && ck.id !== act.id ? `<div class="banner">Pelo relógio, agora seria <b>${esc(ck.sessao)}</b> (${hm(ck.ini)}–${hm(ck.fim)}). <button class="btn small" data-liberar="${ck.id}">Liberar esta etapa</button></div>` : ''}
      <div class="box"><h3>Passo a passo no tempo</h3>${stepsHTML(act)}<p class="muted" style="margin-top:10px;font-size:14px">${esc(act.conteudo)}</p></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" data-auto="1">Deixar os tablets seguirem o relógio</button></div>
    </div>
    <div class="stlist">${DIAS.map(d => `<div class="eyebrow" style="margin-top:8px">${esc(d.rotulo)} · ${esc(d.eixo)}</div>` + ETAPAS.filter(e => e.dia === d.n).map(e => e.tipo === 'pausa'
      ? `<div class="strow pausa"><span class="mono">${hm(e.ini)}–${hm(e.fim)}</span><span>${esc(e.sessao)}</span><span></span><span></span></div>`
      : `<div class="strow ${e.id === act.id ? 'ativa' : ''}"><span class="mono">${hm(e.ini)}–${hm(e.fim)}</span><span>${esc(e.sessao)}${e.tipo === 'grupo' ? ' <span class="badge grupo" style="--g:var(--forest)">grupo</span>' : ''}</span>${e.campos.length ? dotsFor(e) : '<span></span>'}<button class="btn small ${e.id === act.id ? '' : 'ghost'}" data-liberar="${e.id}" ${e.id === act.id && S.ativa ? 'disabled' : ''}>${e.id === act.id && S.ativa ? 'Liberada' : 'Liberar'}</button></div>`).join('')).join('')}</div>
  </div>`;
}
function valueText(f, v) {
  if (v == null || v === '' || (Array.isArray(v) && !v.length)) return '';
  if (f.t === 'multi') return v.join(', ');
  if (f.t === 'rating') return f.o.map((q, i) => `${q}: ${v[i] ?? '–'}`).join('\n');
  if (f.t === 'repeat') return v.map((it, i) => it && Object.values(it).some(x => x) ? (f.titles ? `${f.titles[i]} · ` : `${i + 1}. `) + f.f.map(sf => it[sf.k] ? `${sf.l}: ${it[sf.k]}` : '').filter(Boolean).join(' | ') : '').filter(Boolean).join('\n');
  if (f.t === 'clinica') return v.filter(x => x?.demanda).map((it, i) => `${i + 1}. ${it.demanda} → ${it.categoria || 'sem categoria'}${it.competente ? ' · ' + it.competente : ''}${it.lacuna ? ' · lacuna: ' + it.lacuna : ''}${it.requisito ? ' · requisito: ' + it.requisito : ''}`).join('\n');
  if (f.t === 'priorizacao') return v.filter(x => x?.demanda).map((it, i) => `${i + 1}. ${it.demanda} · total ${f.crit.reduce((a, _, c) => a + (Number(it['c' + c]) || 0), 0)} · ${it.horizonte || 'sem horizonte'}`).join('\n');
  return String(v);
}
function respostasHTML() {
  const sid = S.respStage && E[S.respStage] ? S.respStage : activeStage().id; const e = E[sid];
  return `<div style="display:grid;gap:14px"><div class="toolbar"><label for="resp-stage" class="eyebrow">Etapa</label><select id="resp-stage">${WORK.filter(x => x.ex).map(x => `<option value="${x.id}" ${x.id === sid ? 'selected' : ''}>Dia ${x.dia} · ${hm(x.ini)} · ${esc(x.exNome || x.sessao)}</option>`).join('')}</select></div>
    <div class="cols4">${GRUPOS.map(g => { const d = S.resp[docId(sid, g.id)]; const st = d?.status || 'vazio';
      return `<div class="col" style="--gc:${g.cor}"><div style="display:flex;justify-content:space-between;gap:8px"><span class="gtag" style="--gc:${g.cor}">${esc(g.nome)}</span><span class="s ${st === 'enviada' ? 'ok' : st === 'andamento' ? 'and' : ''}" style="font-size:12px">${st === 'enviada' ? 'Enviado ' + hhmm(d.enviadoEm) : st === 'andamento' ? 'Rascunho' : 'Sem registro'}</span></div>
        ${d ? `<dl>${e.campos.map(f => { const t = valueText(f, d.dados?.[f.k]); return t ? `<div><dt>${esc(f.l || f.item)}</dt><dd>${esc(t)}</dd></div>` : ''; }).join('') || '<p class="empty">Nada registrado ainda.</p>'}</dl>` : '<p class="empty">Nada registrado ainda.</p>'}</div>`; }).join('')}</div></div>`;
}
function matrizRows() {
  const rows = [];
  GRUPOS.forEach(g => {
    const d1 = S.resp[docId('d1-grupos', g.id)]?.dados?.demandas || [];
    const cl = S.resp[docId('d2-clinicas', g.id)]?.dados?.itens || [];
    const pr = S.resp[docId('d3-priorizacao', g.id)]?.dados?.itens || [];
    const crit = E['d3-priorizacao'].campos[0].crit;
    const seen = new Map();
    const tt = E['d1-grupos'].campos.find(f => f.k === 'demandas')?.titles || [];
    d1.forEach((x, i) => { if (x?.problema) seen.set(x.problema.trim(), { grupo: g, origem: 'Dia 1 · ' + (tt[i] || ''), problema: x.problema, usuario: x.usuario, situacao: x.situacao, belem: x.belem, competente: x.competente, lacuna: x.lacuna, prioridade: x.prioridade }); });
    cl.forEach(x => { if (!x?.demanda) return; const k = x.demanda.trim(); const r = seen.get(k) || { grupo: g, origem: 'Dia 2 · clínica', problema: x.demanda }; r.categoria = x.categoria; r.competente = x.competente || r.competente; r.lacuna = x.lacuna || r.lacuna; r.requisito = x.requisito; seen.set(k, r); });
    pr.forEach(x => { if (!x?.demanda) return; const k = x.demanda.trim(); const r = seen.get(k) || { grupo: g, origem: 'Dia 3', problema: x.demanda }; r.notas = crit.map((_, c) => x['c' + c] || ''); r.total = r.notas.reduce((a, n) => a + (Number(n) || 0), 0); r.horizonte = x.horizonte; seen.set(k, r); });
    rows.push(...seen.values());
  });
  return rows.sort((a, b) => (b.total || 0) - (a.total || 0));
}
const MCOLS = [['grupo', 'Grupo'], ['origem', 'Origem'], ['problema', 'Problema ou necessidade'], ['usuario', 'Usuário e finalidade'], ['situacao', 'Situação atual'], ['belem', 'Evidência de Belém'], ['competente', 'Produto ou instituição competente'], ['lacuna', 'Lacuna'], ['categoria', 'Categoria (clínica)'], ['requisito', 'Requisito SISFOGO'], ['prioridade', 'Prioridade (Dia 1)'], ['total', 'Pontuação'], ['horizonte', 'Horizonte']];
function matrizHTML() {
  const rows = matrizRows();
  return `<div style="display:grid;gap:12px"><p class="muted" style="margin:0">Montada automaticamente: demandas dos grupos temáticos (Dia 1), classificação das clínicas (Dia 2) e pontuação da priorização (Dia 3). Ordenada pela pontuação. Responsável e prazo indicativo vêm do plano de seguimento.</p>
    ${rows.length ? `<div class="tbl-wrap"><table><thead><tr>${MCOLS.map(c => `<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${MCOLS.map(([k]) => k === 'grupo' ? `<td><span class="gtag" style="--gc:${r.grupo.cor}">${esc(r.grupo.papel)}</span></td>` : k === 'total' ? `<td class="n">${r.total ?? ''}</td>` : `<td>${esc(r[k] || '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : `<p class="empty">A matriz aparece aqui assim que os grupos registrarem as demandas na sessão de grupos temáticos (Dia 1, 15h30).</p>`}</div>`;
}
function perguntasList() {
  const out = [];
  GRUPOS.forEach(g => WORK.forEach(e => { const d = S.resp[docId(e.id, g.id)]?.dados; if (!d) return;
    if (d.pergunta) out.push({ g, e, texto: d.pergunta, dest: d.destinatario || (e.quem || '') });
    (d.perguntas || []).forEach(p => p?.texto && out.push({ g, e, texto: p.texto, dest: p.destinatario || '' })); }));
  return out;
}
function perguntasHTML() {
  const ps = perguntasList(); const by = {};
  ps.forEach(p => (by[p.dest || 'Sem destinatário'] ||= []).push(p));
  return ps.length ? `<div class="cardgrid">${Object.entries(by).map(([d, arr]) => `<div class="card"><div class="ct"><b>${esc(d)}</b><span class="badge">${arr.length}</span></div>${arr.map(p => `<div style="display:grid;gap:2px"><span class="gtag" style="--gc:${p.g.cor};font-size:12.5px">${esc(p.g.papel)} · ${esc(p.e.sessao)}</span><span>${esc(p.texto)}</span></div>`).join('')}</div>`).join('')}</div>` : `<p class="empty">As perguntas registradas pelos grupos aparecem aqui, agrupadas por destinatário, para entregar a quem conduz cada mesa.</p>`;
}
function termoHTML() {
  const local = LS.get('termo', {}); const T = { ...local, ...S.termo };
  return `<div style="display:grid;gap:12px"><p class="muted" style="margin:0">Contagem aproximada dos cartões ao fim de cada estado (Dia 1). Verde: realidade semelhante · Branco: quero saber mais · Rosa: lacuna também crítica para nós.</p>
    <div class="termo">${UFS.map(uf => { const v = T[uf] || T[uf.replace(/\s/g, '_')] || {}; return `<div class="card"><b style="font-family:var(--f-display);font-size:17px">${esc(uf)}</b>
      ${[['verde', 'Verde'], ['branco', 'Branco'], ['rosa', 'Rosa']].map(([c, l]) => `<label for="t-${uf}-${c}">${l}<input inputmode="numeric" id="t-${esc(uf.replace(/\s/g, '_'))}-${c}" data-termo="${esc(uf)}|${c}" value="${v[c] ?? ''}"></label>`).join('')}</div>`; }).join('')}</div></div>`;
}
function exportHTML() {
  return `<div class="two">
    <div class="box" style="display:grid;gap:12px"><h3>Exportar</h3><p class="muted">Para o relatório: a matriz comum em planilha (CSV) e todas as respostas em arquivo completo (JSON).</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-exp="csv">Baixar matriz comum (CSV)</button><button class="btn ghost" data-exp="json">Baixar todas as respostas (JSON)</button></div>
      <p class="muted" style="font-size:13.5px">Se o download não abrir, use a caixa abaixo para copiar o conteúdo completo.</p>
      <textarea class="io" id="exp-text" readonly>${esc(JSON.stringify(exportObj(), null, 1))}</textarea><button class="btn small ghost" data-copy="exp-text">Copiar</button></div>
    <div class="box" style="display:grid;gap:12px"><h3>Importar de um tablet sem conexão</h3><p class="muted">No tablet que ficou sem internet, abra Painel da equipe, Exportar, copie o conteúdo e cole aqui. Vale sempre a versão mais recente de cada resposta.</p>
      <textarea class="io" id="imp-text" placeholder="Cole aqui o conteúdo exportado"></textarea><button class="btn" id="imp-btn">Importar respostas</button></div>
  </div>`;
}
function exportObj() { return { evento: CFG.evento, exportadoEm: new Date().toISOString(), respostas: S.resp, avaliacoes: S.avals.length ? S.avals : LS.get('avals', []), termometro: { ...LS.get('termo', {}), ...S.termo } }; }
async function exportar(kind) {
  let data, filename;
  if (kind === 'csv') {
    const q = (s) => `"${String(s ?? '').replace(/"/g, '""')}"`;
    const rows = matrizRows();
    data = '﻿' + [MCOLS.map(c => q(c[1])).join(';'), ...rows.map(r => MCOLS.map(([k]) => q(k === 'grupo' ? r.grupo.papel : r[k])).join(';'))].join('\r\n');
    filename = 'matriz-comum-encontro-fogo.csv';
  } else if (kind === 'aval') {
    const q = (s) => `"${String(s ?? '').replace(/"/g, '""')}"`; const items = E['d3-encerramento'].individual.campos[0].o;
    const all = S.avals.length ? S.avals : LS.get('avals', []);
    data = '\ufeff' + [[...items, 'Perfil', 'Manter', 'Melhorar', 'Compromisso'].map(q).join(';'), ...all.map(a => [...items.map((_, i) => a.aval?.[i] ?? ''), a.perfil, a.manter, a.melhorar, a.compromisso].map(q).join(';'))].join('\r\n');
    filename = 'avaliacoes-individuais-encontro-fogo.csv';
  } else { data = JSON.stringify(exportObj(), null, 2); filename = 'respostas-encontro-fogo.json'; }
  if (!S.downloads) { toast('Download indisponível aqui. Use o botão Copiar.'); return; }
  try { await S.downloads.save({ filename, data }); } catch { toast('Download não concluído. Use o botão Copiar.'); }
}
function importar() {
  let obj; try { obj = JSON.parse($('#imp-text').value); } catch { toast('Conteúdo inválido. Cole o texto exportado completo.'); return; }
  const r = obj.respostas || {}; let n = 0;
  Object.entries(r).forEach(([id, v]) => { if (!v?.etapa || !v?.grupo) return; const cur = S.resp[id]; if (!cur || (v.atualizadoEm || 0) > (cur.atualizadoEm || 0)) { S.resp[id] = v; LS.set('r:' + id, v); if (S.db && S.mode === 'online') S.db.doc('respostas/' + id).set(v).catch(() => {}); n++; } });
  const av = obj.avaliacoes || []; let m = 0; const loc = LS.get('avals', []);
  av.forEach(a => { if (a?.enviadoEm && !loc.find(x => x.enviadoEm === a.enviadoEm && x.tablet === a.tablet)) { loc.push({ ...a, sync: false }); m++; } }); LS.set('avals', loc);
  toast(`${n} respostas e ${m} avaliações importadas`); render();
}

// ---------- início ----------
setSync(); route(); connect();
setInterval(() => { tick(); if (!DEMO && S.ativaAuto && S.role && S.role !== 'equipe') { const a = activeStage(); const cur = document.querySelector('.tl li.ativa button')?.dataset.go; if (cur && cur !== a.id && !document.activeElement?.matches?.('input,textarea')) { S.view = null; render(); } } }, 15000);
setInterval(() => { const el = $('#clock'); const d = new Date(); el.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`; }, 5000);
// wake lock para o tablet não apagar
(async () => { try { await navigator.wakeLock?.request('screen'); } catch {} })();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { try { navigator.wakeLock?.request('screen'); } catch {} } });
})();
</script>
